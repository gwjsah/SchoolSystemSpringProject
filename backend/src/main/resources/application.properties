server.port=8080
server.servlet.context-path=/api

spring.datasource.url=jdbc:mysql://localhost:3306/school_management?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# Hibernate 6 detects the MySQL dialect automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

logging.level.com.schoolsystem=DEBUG

# JWT (use a long random secret and move it to an environment variable)
app.jwtSecret=change_this_to_a_long_random_secret_of_at_least_32_chars
app.jwtExpirationMs=86400000

# React dev servers (CRA / Vite)
app.cors.allowedOrigins=http://localhost:3000,http://localhost:5173
